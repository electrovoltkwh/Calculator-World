<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ohm's Law Advanced Calculator</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:30px;
    font-family:Arial, sans-serif;
    background:#07111f;
    color:white;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
    color:#38bdf8;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    margin-bottom:30px;
}

.card{
    background:#0f1b2d;
    border:1px solid #1e3a5f;
    border-radius:18px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h2{
    color:#7dd3fc;
    margin-top:0;
}

.input-box{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#cbd5e1;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #334155;
    background:#020617;
    color:white;
    font-size:17px;
    outline:none;
}

input:focus{
    border-color:#38bdf8;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.calculate{
    background:#0284c7;
    color:white;
}

.reset{
    background:#334155;
    color:white;
}

button:hover{
    opacity:.85;
}

.results{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.result{
    background:#020617;
    border:1px solid #164e63;
    border-radius:12px;
    padding:18px;
    text-align:center;
}

.result span{
    display:block;
    color:#94a3b8;
    font-size:14px;
    margin-bottom:8px;
}

.result strong{
    font-size:25px;
    color:#38bdf8;
}

.message{
    margin-top:20px;
    padding:13px;
    text-align:center;
    border-radius:10px;
    background:#111c2e;
    color:#cbd5e1;
}

.formula{
    text-align:center;
    font-size:25px;
    color:#facc15;
    padding:15px;
}

@media(max-width:600px){

    body{
        padding:15px;
    }

    .results{
        grid-template-columns:1fr;
    }

    .buttons{
        flex-direction:column;
    }

}

</style>
</head>


<body>

<div class="container">

<h1>⚡ Ohm's Law Calculator</h1>

<p class="subtitle">
Advanced Electrical Engineering Calculator
</p>


<!-- INPUT SECTION -->

<div class="card">

<h2>🔌 Enter Values</h2>

<div class="input-box">

<label for="voltage">
Voltage (V)
</label>

<input
type="number"
id="voltage"
placeholder="Example: 230"
step="any"
>

</div>


<div class="input-box">

<label for="current">
Current (A)
</label>

<input
type="number"
id="current"
placeholder="Example: 5"
step="any"
>

</div>


<div class="input-box">

<label for="resistance">
Resistance (Ω)
</label>

<input
type="number"
id="resistance"
placeholder="Example: 46"
step="any"
>

</div>


<div class="buttons">

<button
class="calculate"
onclick="calculateOhm()"
>
⚡ Calculate
</button>

<button
class="reset"
onclick="resetCalculator()"
>
↻ Reset
</button>

</div>

</div>


<!-- FORMULA -->

<div class="card">

<h2>📐 Ohm's Law</h2>

<div class="formula">
V = I × R
</div>

</div>


<!-- RESULTS -->

<div class="card">

<h2>📊 Results</h2>

<div class="results">

<div class="result">

<span>Voltage</span>

<strong id="outVoltage">
—
</strong>

</div>


<div class="result">

<span>Current</span>

<strong id="outCurrent">
—
</strong>

</div>


<div class="result">

<span>Resistance</span>

<strong id="outResistance">
—
</strong>

</div>


<div class="result">

<span>Power</span>

<strong id="outPower">
—
</strong>

</div>

</div>


<div
class="message"
id="message"
>
Enter any TWO values.
</div>

</div>


<!-- FORMULAS -->

<div class="card">

<h2>🧮 Power Formulas</h2>

<div class="results">

<div class="result">
<span>Power</span>
<strong>P = V × I</strong>
</div>

<div class="result">
<span>Power</span>
<strong>P = I² × R</strong>
</div>

<div class="result">
<span>Power</span>
<strong>P = V² / R</strong>
</div>

<div class="result">
<span>Current</span>
<strong>I = V / R</strong>
</div>

</div>

</div>

</div>


<script>

function calculateOhm(){

    let voltageInput =
        document.getElementById("voltage");

    let currentInput =
        document.getElementById("current");

    let resistanceInput =
        document.getElementById("resistance");


    let V =
        parseFloat(voltageInput.value);

    let I =
        parseFloat(currentInput.value);

    let R =
        parseFloat(resistanceInput.value);


    let values = 0;

    if(!isNaN(V)){
        values++;
    }

    if(!isNaN(I)){
        values++;
    }

    if(!isNaN(R)){
        values++;
    }


    /*
        Exactly TWO values required
    */

    if(values !== 2){

        showMessage(
            "⚠️ Please enter exactly TWO values."
        );

        return;
    }


    /*
        Calculate Resistance
    */

    if(isNaN(R)){

        if(I === 0){

            showMessage(
                "❌ Current cannot be zero."
            );

            return;
        }

        R = V / I;

        resistanceInput.value =
            R.toFixed(4);
    }


    /*
        Calculate Current
    */

    else if(isNaN(I)){

        if(R === 0){

            showMessage(
                "❌ Resistance cannot be zero."
            );

            return;
        }

        I = V / R;

        currentInput.value =
            I.toFixed(4);
    }


    /*
        Calculate Voltage
    */

    else if(isNaN(V)){

        V = I * R;

        voltageInput.value =
            V.toFixed(4);
    }


    /*
        Calculate Power
    */

    let P = V * I;


    /*
        Show Results
    */

    document.getElementById("outVoltage").innerText =
        formatNumber(V) + " V";

    document.getElementById("outCurrent").innerText =
        formatNumber(I) + " A";

    document.getElementById("outResistance").innerText =
        formatNumber(R) + " Ω";

    document.getElementById("outPower").innerText =
        formatNumber(P) + " W";


    showMessage(
        "✅ Calculation completed successfully!"
    );

}


function formatNumber(number){

    if(Math.abs(number) >= 1000000){

        return (
            number / 1000000
        ).toFixed(3) + " M";

    }


    if(Math.abs(number) >= 1000){

        return (
            number / 1000
        ).toFixed(3) + " k";

    }


    return number.toFixed(3);

}


function showMessage(text){

    document.getElementById("message").innerText =
        text;

}


function resetCalculator(){

    document.getElementById("voltage").value = "";

    document.getElementById("current").value = "";

    document.getElementById("resistance").value = "";


    document.getElementById("outVoltage").innerText =
        "—";

    document.getElementById("outCurrent").innerText =
        "—";

    document.getElementById("outResistance").innerText =
        "—";

    document.getElementById("outPower").innerText =
        "—";


    showMessage(
        "Enter any TWO values."
    );

}

</script>

</body>
</html>
